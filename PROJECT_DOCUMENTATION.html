# NutriGuide: Intelligent Precision Nutrition & Clinical Lifestyle Management Platform
## Complete Software Engineering Documentation & Project Report

---

## 1. Problem Statement

### 1.1 Background & Context
Modern lifestyle patterns, sedentary desk jobs, and shifting dietary habits have led to an unprecedented surge in lifestyle-related non-communicable diseases (NCDs), including Type-2 Diabetes Mellitus, Hypertension, Cardiovascular Diseases (CVD), and Polycystic Ovary Syndrome (PCOS). Dietary management remains the cornerstone of both prevention and therapeutic intervention. 

However, individuals attempting to regulate their diet face substantial obstacles:
- **Generic & Impractical Diets**: Existing dietary applications predominantly utilize Western-centric nutritional databases (e.g., USDA) and lack nuanced understanding of regional culinary practices, particularly Indian dietary patterns rich in diverse legumes, spices, flatbreads, and regional preparations.
- **Static Calorie Counters**: Traditional mobile trackers treat daily calorie targets as static arithmetic equations, ignoring real-time physiological stress, fluctuating daily physical exertion, metabolic rates, and sleep-induced recovery.
- **Siloed Wearable Telemetry**: While millions of users wear smartwatches capturing continuous vitals (heart rate, SpO2, step count, active calories burned, stress levels), this telemetry remains siloed in fitness dashboards and is rarely translated into actionable dietary adjustments.
- **Cognitive Fatigue & Manual Logging**: Tracking individual ingredients is labor-intensive, resulting in high user drop-off within 7 to 14 days. Furthermore, users lack real-time access to clinical nutritionists for immediate queries, meal swaps, or hydration reminders.
- **Lack of Explainability (Black-Box Recommendations)**: Machine learning models that suggest meals rarely explain *why* a particular meal was recommended, eroding user trust and adherence.

### 1.2 Proposed Solution: NutriGuide
**NutriGuide** is an intelligent, full-stack, cross-platform precision health and nutrition platform. It bridges wearable Internet-of-Things (IoT) telemetry, Indian clinical dietary guidelines (ICMR-NIN standards), hybrid machine-learning recommendation algorithms, and an autonomous, agentic LLM (Google Gemini 3) Diet Coach.

NutriGuide solves the problem by:
1. **Clinical BMR/TDEE & Macro Personalization**: Calculating basal metabolic rate and macronutrient distribution dynamically based on clinical anthropometric formulas (Mifflin-St Jeor).
2. **Wearable IoT Stream Ingestion & Preprocessing**: Processing raw smartwatch telemetry streams, imputing corrupted readings, computing sleep recovery scores, and dynamically adapting caloric and hydration targets.
3. **Hybrid Recommendation Engine with Explainable AI (XAI)**: Combining content-based medical filtering, collaborative filtering from peer ratings, and rule-based clinical safety filters, accompanied by transparent natural language justifications.
4. **Agentic Conversational Diet Coach**: Implementing an autonomous AI coach powered by Gemini 3 that not only answers complex clinical queries but also autonomously executes UI workflows (logging water, toggling completed meals, swapping recipes, and navigating views) via a structured action protocol.
5. **Fault-Tolerant Multi-Tier Persistence**: Guaranteeing continuous offline/online operation across MySQL, SQLite fallback, and client-side `localStorage`.

## 2. Software Requirements Specification (SRS)

### 2.1 User Personas
- **Persona 1: Working Professional (Sedentary/High Stress)**: Needs automated meal planning that adapts to irregular sleep and high daily stress, requires automated grocery checklists, and benefits from an interactive coach to log water effortlessly.
- **Persona 2: Clinical Patient (Managing Type-2 Diabetes / Hypertension)**: Requires strict sodium (<2000mg/day) and free sugar (<25g/day) constraints according to ICMR-NIN guidelines, with meal recommendations clearly indicating safety compliance.
- **Persona 3: Fitness Enthusiast (Weight Loss / Muscle Gain)**: Tracks precise protein-to-carbohydrate ratios, monitors real-time active calories burned from smartwatches, and logs daily meal completion.

### 2.2 Functional Requirements (FR)

| Req ID | Module | Description | Priority |
| :--- | :--- | :--- | :--- |
| **FR-01** | User Onboarding | The system shall capture user anthropometrics (age, gender, height, weight, activity level, fitness goal, dietary preference) and compute BMR, TDEE, and target macros (Protein, Carbs, Fat). | High |
| **FR-02** | Telemetry Pipeline | The system shall ingest raw smartwatch telemetry (`smartwatch_data.csv`), clean corrupted entries (NaN, ERROR, out-of-bounds BPM/SpO2), compute sleep recovery scores, and stream simulated real-time records. | High |
| **FR-03** | Hybrid Recommender | The system shall generate personalized meal recommendations using a weighted hybrid of Content-Based Filtering (Cosine Similarity over nutritional vectors + medical constraints) and Collaborative Filtering (User-Item rating matrix). | High |
| **FR-04** | Explainable AI (XAI) | Every recommended recipe shall include transparent textual justifications detailing why it fits the user’s metabolic state, vitals, and medical profile. | High |
| **FR-05** | Meal Planning & Swapping | The system shall generate a daily 4-slot meal plan (Breakfast, Lunch, Dinner, Snack) and allow users to swap any slot with an alternate nutritionally equivalent recipe. | High |
| **FR-06** | Meal & Water Tracking | The system shall allow users to check off completed meals and log hydration (in 250ml cup increments up to an 8-cup / 2.0L daily target). | High |
| **FR-07** | Smart Shopping List | The system shall aggregate ingredients across all planned meals, classify them into categorized departments (Produce, Proteins, Dairy, Pantry), and provide an interactive checklist. | Medium |
| **FR-08** | Autonomous AI Coach | The system shall integrate a conversational agent (Gemini 3) that accepts natural language queries, references live user metrics, and autonomously emits structured `ACTION_TRIGGER` commands to mutate frontend state. | High |
| **FR-09** | Clinical RDA Evaluation | The system shall benchmark total daily nutritional intake against ICMR-NIN Recommended Dietary Allowances (RDA) for energy, fiber, sodium, calcium, iron, and vitamins. | High |
| **FR-10** | Dual-Database Persistence | The backend shall persist state in MySQL, automatically fallback to local SQLite (`database.db`) if MySQL is unavailable, and allow the frontend to fallback to `localStorage` when offline. | High |

### 2.3 Non-Functional Requirements (NFR)

- **NFR-01: Performance & Latency**: API responses for state updates and recommendations must execute in under 300ms. AI Diet Coach conversational turns must return in under 2.5 seconds using optimized Google Gemini flash-lite models.
- **NFR-02: Availability & Fault Tolerance**: System uptime must exceed 99.5%. In the event of backend server disconnection, the frontend shall continue uninterrupted utilizing client-side caching (`localStorage`). In the event of Gemini API quota exhaustion or network disruption, the chatbot shall automatically fallback to the local deterministic rule-based NLP matcher.
- **NFR-03: Security & Privacy**: Sensitive health telemetry and biometric indicators must be securely processed. Database credentials and API keys must be isolated in server-side `.env` files and never exposed to the client bundle.
- **NFR-04: Cross-Platform Compatibility**: The web frontend must render responsively across mobile, tablet, and desktop screens (viewport widths 360px to 2560px) and compile natively to Android APK via Capacitor.
- **NFR-05: Usability & Accessibility**: The UI shall follow modern Glassmorphism principles with high color contrast, readable typography, and intuitive Lucide icons.

## 3. Software Design Document (SDD)

### 3.1 Architectural Pattern
NutriGuide adopts a **Client-Server-Agentic Architecture** with asynchronous event dispatching:
1. **Presentation Layer (Frontend)**: React 19 single-page application built on Vite, utilizing reactive component state hooks and encapsulated service abstractions.
2. **Application & Orchestration Layer (Backend)**: Python Flask RESTful API providing statistical data pipelines, hybrid recommendation mathematical kernels, and LLM prompt orchestration.
3. **Intelligence Layer (Google Gemini)**: Multimodal Large Language Model executing agentic intent parsing and conversational generation.
4. **Data Persistence Layer**: Dual-relational database architecture (Primary: MySQL; Local Embedded: SQLite) with client-side mirrored browser storage (`localStorage`).

### 4.3 Key Algorithms & Implementation Details

#### A. Anthropometric Caloric & Macro Formulation (Mifflin-St Jeor)
In `Onboarding.jsx` and `app.py`:
- BMR (Male): 10 * weight(kg) + 6.25 * height(cm) - 5 * age + 5
- BMR (Female): 10 * weight(kg) + 6.25 * height(cm) - 5 * age - 161
- TDEE: BMR * Activity Multiplier (1.2 to 1.9)
- Weight Loss Target: TDEE - 500 kcal
- Weight Gain Target: TDEE + 400 kcal
- Balanced Split: 25% Protein, 50% Carbs, 25% Fat

#### B. Telemetry Cleaning & Sleep Recovery Score
In `data_pipeline.py`:
- Outliers (BPM < 40 or > 220; SpO2 < 80%) are replaced with statistical medians.
- Active Calories Burned: (Steps * 0.04) + (Heart Rate - 60) * 1.5
- Sleep Recovery Score (0-100): min(100, max(0, (Sleep Hours / 8.0) * 70 + (10 - Stress Level) * 3))

#### C. Hybrid Recommendation Kernel with XAI
In `app.py`:
- Score(u, i) = alpha * Sim_content(u, i) + (1 - alpha) * Rating_collaborative(u, i)
- Hard medical safety filters for Sodium and Free Sugar.
- Real-time IoT biometric adjustments.
- Natural language justifications (XAI) for clinical transparency.

#### D. Agentic Gemini Action Protocol
In `app.py` and `App.jsx`:
- The model outputs: `ACTION_TRIGGER: {"type": "add_water", "amount": 500}`
- The Flask backend intercepts, cleans the reply text, and returns structured JSON.
- `handleChatAction` in React updates state variables and synchronizes with the database.

## 5. Software Testing Suite

### 5.1 Test Strategy & Scope
NutriGuide employs a multi-layered verification strategy:
1. **Unit Testing**: Mathematical correctness of BMR/TDEE calculations, data pipeline cleaning rules, and macro split logic.
2. **Integration Testing**: Dual database persistence (MySQL to SQLite fallback), and REST API client communication.
3. **Agentic System Testing**: Gemini API intent detection, action formatting, and autonomous UI state execution.
4. **Resilience & Fallback Testing**: Validating system behavior during network disconnection and API unavailability.
5. **Cross-Platform / Mobile Testing**: UI responsiveness across viewports and Capacitor Android APK installation.
